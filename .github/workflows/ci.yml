name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '10.x'
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SqlInterpol.slnx

      - name: Build
        run: dotnet build SqlInterpol.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SqlInterpol.slnx --no-build --configuration Release --verbosity normal
