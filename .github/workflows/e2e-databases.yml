name: Live Database E2E Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target database(s) (e.g. "PostgreSQL", "PostgreSQL, SqlServer", or leave empty for "all")'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: pwsh

jobs:
  prepare-matrix:
    name: Prepare Test Matrix
    runs-on: ubuntu-latest
    outputs:
      dialects: ${{ steps.set-matrix.outputs.dialects }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Dynamic Matrix
        id: set-matrix
        run: .github/scripts/Get-E2EDatabaseMatrix.ps1 -Target "${{ inputs.target }}"

  run-e2e:
    name: Test ${{ matrix.item.dialect }}
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.dialects != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prepare-matrix.outputs.dialects) }}
    uses: ./.github/workflows/e2e-dialect-runner.yml
    with:
      dialect: ${{ matrix.item.dialect }}
      has_tests: ${{ matrix.item.hasTests }}

  e2e-gatekeeper:
    name: E2E Gatekeeper
    runs-on: ubuntu-latest
    if: always()
    needs: [run-e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Evaluate E2E Results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: .github/scripts/Test-E2EDatabaseGatekeeper.ps1