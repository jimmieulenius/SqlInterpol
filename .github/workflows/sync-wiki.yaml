name: Sync Docs to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Markdown Files to Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki_repo

          # Clear existing wiki files (excluding .git) so deletions in docs/ are synced
          find wiki_repo -maxdepth 1 -type f ! -name '.git*' -delete

          # Copy updated docs
          cp -r docs/* wiki_repo/

          cd wiki_repo
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "chore(wiki): sync documentation from main [skip ci]"
            git push
          fi